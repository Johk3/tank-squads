[shortcut-description]
tank-squad-command-tool=Grab the command tool to select and order Tank Squad soldiers.
tank-squad-patrol-mode=While active, alt-drag with the command tool adds waypoints to your squad's patrol route instead of issuing a move or attack order.
tank-squad-scout-mode=Sends the selected division out to explore uncharted map on its own. It splits into teams that each explore their own direction in formation, fight what they meet, and drive back to a barracks to heal.
tank-squad-escort=Dedicate the selected division to a player. Defensive holds a wide ring and intercepts attackers; offensive roams far out and clears everything it finds.

