[entity-description]
tank-squad-siege=A slow long-range tank with an oversized cannon. Fires cannon shells at targets up to 52 tiles away. Ammunition is supplied during training.
tank-squad-flame=A heavily armored close-range flame tank with 2,400 HP and strong fire resistance. Its flame stream burns enemies without leaving ground fires. Ammunition is supplied during training.
tank-squad-soldier-1=A tracked chaingun carrier armed with firearm rounds. Built automatically by a barracks stocked with firearm magazines. Pathfinding, targeting and combat run in the game engine, not in the mod's own scripting.
tank-squad-soldier-2=A tracked chaingun carrier armed with piercing rounds. Built automatically by a barracks stocked with piercing rounds magazines.
tank-squad-soldier-3=A tracked chaingun carrier armed with uranium rounds. Built automatically by a barracks stocked with uranium rounds magazines.
tank-squad-barracks=Trains tank soldiers from a recipe you choose, showing its progress like any assembling machine. Needs no power. Binds to the nearest rally flag and heals nearby friendly soldiers once a second.
tank-squad-rally-flag=Marks where new soldiers from the nearest barracks muster and guard. Each barracks binds independently to whichever flag is nearest to it.
tank-squad-headquarters=A huge, very slow and unarmed command vehicle with 400 HP that flattens trees, rocks and cliffs in its way. Heals friendly soldiers within 24 tiles, even on the move. When it parks it sets up camp: a roboport with 25 times the normal reach, 12 MW of solar decks and a 1 GJ battery, wired to a friendly electric pole within 12 tiles. The camp stays put while it drives and moves to it when it parks again. Open it to load robots and repair packs. Injured escort and scout soldiers retreat to it. It never fights, scouts or escorts.

