[mod-setting-description]
tank-squads-escort-ring-radius=Distance in tiles from the protected player to the defensive ring. Larger keeps soldiers out of your factory; smaller lets them reach threats sooner.
tank-squads-escort-detect-radius=Enemies within this many tiles of the protected player, or of the centre of the defensive ring, make defensive soldiers respond. Always at least the ring radius plus 16.
tank-squads-escort-band-min=Offensive escorts roam and attack no closer than this many tiles to the protected player.
tank-squads-escort-band-max=Offensive escorts roam and attack no further than this many tiles from the protected player. Always at least the inner edge plus 32.
tank-squads-escort-anchor-step=An escort only moves after the protected player settles this many tiles from its current centre. Larger means fewer reshuffles while you walk around your base.
tank-squads-retreat-health=An escorting or scouting soldier below this health goes to the nearest barracks or headquarters to heal, with guards in larger divisions and teams.
tank-squads-rejoin-health=A retreating soldier returns once healed to this health. Always at least the retreat health plus 5, and at most 100.
tank-squads-retreat-range=Soldiers only retreat to a barracks or headquarters within this many tiles of them; otherwise they keep fighting.
tank-squads-soldier-vision=Keep the map live around every soldier, like a radar's nearby coverage, so you see their fights. Turn off to save the charting work on very large armies.
