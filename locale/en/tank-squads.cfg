tank-squad-headquarters=Mobile headquarters

[technology-description]
tank-squad-unlock=Unlocks the Tank Squad barracks and rally flag, letting you build, command and patrol tank-based combat squads.
tank-squad-headquarters=Lets a barracks build the mobile headquarters: a slow, unarmed command vehicle that heals soldiers and sets up camp wherever it parks, with a far-reaching roboport and solar decks that power nearby grids.

