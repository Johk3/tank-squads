[item-description]
tank-squad-barracks=Place near a rally flag, choose a training recipe, then supply steel plate, iron gear wheels and the required ammunition.
tank-squad-rally-flag=Place where you want a garrison to form. New soldiers from the nearest barracks will muster and guard here.
tank-squad-command-tool=Drag over soldiers to select them. Alt-drag over enemies to attack that area, or over empty ground to move there. CONTROL + 1-9 binds the selection to a division; ALT + 1-9 selects one back. With patrol mode on, alt-drag adds a waypoint to the selected division's route.

